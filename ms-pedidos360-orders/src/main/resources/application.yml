# Perfil por defecto: H2 en archivo (local). En la EC2 usar SPRING_PROFILES_ACTIVE=mysql
server:
  port: 8081

spring:
  application:
    name: ms-pedidos360-orders

  datasource:
    url: jdbc:h2:file:./data/orders-db;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASSWORD:guest}
    connection-timeout: 3000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

  h2:
    console:
      enabled: true
      path: /h2-console

# direccion interna de catalog
pedidos360:
  catalog-base-url: http://localhost:8082

logging:
  level:
    abaid.pedidos360.orders: INFO

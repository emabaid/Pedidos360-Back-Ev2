server:
  port: 8084
  tomcat:
    threads:
      max: 20

spring:
  application:
    name: ms-pedidos360-rabbit-admin

  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASSWORD:guest}
    connection-timeout: 3000

pedidos360:
  rabbit:
    # direccion del panel/API de gestion de RabbitMQ (usa las mismas credenciales)
    management-url: ${RABBIT_MGMT_URL:http://localhost:15672}

logging:
  level:
    abaid.pedidos360.rabbitadmin: INFO
